<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JXDE 600FPS Video Processor</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121214; color: #e1e1e6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #202024; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #00b37e; font-size: 24px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input[type="file"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #29292e; background: #121214; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00b37e; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #008f63; }
    </style>
</head>
<body>
    <div class="card">
        <h1>JXDE 600FPS</h1>
        <p style="text-align: center; color: #8d8d99; font-size: 14px;">Upload a video to upscale its frame rate.</p>
        
        <form action="/process" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="video">Select Video File:</label>
                <input type="file" id="video" name="video" accept="video/*" required>
            </div>
            
            <div class="form-group">
                <label for="fps">Target FPS:</label>
                <input type="text" id="fps" name="fps" value="600">
            </div>
            
            <button type="submit">Convert Video</button>
        </form>
    </div>
</body>
</html>
