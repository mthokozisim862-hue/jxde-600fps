<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JXDE 600FPS</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at top, #1a1a1a, #050505 55%);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 25px 16px;
        }
        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-top: 15px;
        }
        .subtitle {
            text-align: center;
            color: #999;
            margin-top: 7px;
            margin-bottom: 25px;
        }
        .card {
            background: #101010;
            border: 1px solid #292929;
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        .upload {
            border: 2px dashed #3b3b3b;
            border-radius: 18px;
            padding: 35px 15px;
            text-align: center;
            cursor: pointer;
            display: block;
            transition: .2s;
        }
        .upload:hover {
            border-color: white;
        }
        .upload input {
            display: none;
        }
        .upload-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .upload-small {
            color: #888;
            font-size: 13px;
        }
        select {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            background: #181818;
            color: white;
            border: 1px solid #333;
            border-radius: 13px;
            font-size: 16px;
            outline: none;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 13px;
            background: white;
            color: black;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }
        .status {
            margin-top: 18px;
            text-align: center;
            color: #aaa;
            line-height: 1.5;
        }
        .download {
            display: block;
            margin-top: 18px;
            padding: 16px;
            text-align: center;
            border-radius: 13px;
            background: #1c1c1c;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .download:hover {
            background: #2a2a2a;
        }
        .warning {
            margin-top: 18px;
            font-size: 12px;
            line-height: 1.5;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">JXDE</div>
    <div class="subtitle">600FPS UPLOAD METHOD</div>

    <div class="card">
        <label class="upload">
            <input type="file" id="video" accept="video/*">
            <div class="upload-title" id="filename">Tap to upload video</div>
            <div class="upload-small">MP4 recommended</div>
        </label>

        <select id="fps">
            <option value="60">60 FPS</option>
            <option value="120">120 FPS</option>
            <option value="240">240 FPS</option>
            <option value="600" selected>600 FPS</option>
        </select>

        <button id="process">CREATE JXDE VIDEO</button>
        <div class="status" id="status"></div>
        <a class="download" id="download" style="display: none;">DOWNLOAD VIDEO</a>

        <div class="warning">
            600 FPS is created through frame interpolation. It does not create genuinely captured 600 FPS footage.
        </div>
    </div>
</div>

<script>
    const videoInput = document.getElementById("video");
    const filenameLabel = document.getElementById("filename");
    const processButton = document.getElementById("process");
    const statusDiv = document.getElementById("status");
    const downloadLink = document.getElementById("download");

    videoInput.addEventListener("change", function() {
        if (videoInput.files.length > 0) {
            filenameLabel.textContent = videoInput.files[0].name;
        }
    });

    processButton.addEventListener("click", async function() {
        if (!videoInput.files.length) {
            alert("Please select a video first.");
            return;
        }

        processButton.disabled = true;
        downloadLink.style.display = "none";
        statusDiv.textContent = "Uploading video...";

        const formData = new FormData();
        formData.append("video", videoInput.files[0]);
        formData.append("fps", document.getElementById("fps").value);

        try {
            statusDiv.textContent = "Processing... This can take a while for high frame rates.";
            const response = await fetch("/process", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Processing failed");
            }

            statusDiv.textContent = "JXDE processing complete ✓";
            downloadLink.href = data.download;
            downloadLink.style.display = "block";
        } catch (error) {
            statusDiv.textContent = "Error: " + error.message;
            console.error(error);
        } finally {
            processButton.disabled = false;
        }
    });
</script>

</body>
</html>
